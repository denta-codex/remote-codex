---
- name: Remote Codex build, release, deployment, or delivery
  hosts: all
  gather_facts: false
  vars:
    repo: "{{ playbook_dir | dirname }}"
    remote_codex_action: preview
    secret_dir: /home/agent/.local/share/remote-codex
    route_host: grace.taila198f.ts.net:443
    remote_codex_update_url: https://grace.taila198f.ts.net
    remote_codex_loopback_url: http://127.0.0.1:8787
    run_log: "{{ lookup('ansible.builtin.env', 'REMOTE_CODEX_RUN_LOG') }}"
  tasks:
    - name: Run requested workflow
      block:
        - name: "Stage: preflight"
          ansible.builtin.set_fact:
            release_stage: preflight
            release_built: false
            release_published: false
            publication_attempted: false
            release_verified: false

        - name: Validate selected action
          ansible.builtin.assert:
            that:
              - remote_codex_action in ['preview', 'build', 'release', 'deploy', 'publish', 'deliver']
              - run_log | length > 0
              - not (ansible_check_mode and remote_codex_action in ['build', 'release'])
            fail_msg: Use scripts/deploy. Build/release cannot run in check mode; preview publication with action=publish --check after building.

        - name: Verify executing identity
          ansible.builtin.command: id -un
          register: identity
          changed_when: false
          check_mode: false

        - name: Find user manager runtime directory
          ansible.builtin.command: id -u
          register: user_id
          changed_when: false
          check_mode: false

        - name: Verify host
          ansible.builtin.command: hostname
          register: host
          changed_when: false
          check_mode: false

        - name: Refuse unintended endpoint
          ansible.builtin.assert:
            that:
              - identity.stdout == expected_user
              - host.stdout == expected_hostname

        - name: Prepare new release
          ansible.builtin.include_tasks: tasks/prepare.yml
          when: remote_codex_action in ['build', 'release']

        - name: Build and sign
          ansible.builtin.include_tasks: tasks/build.yml
          when: remote_codex_action in ['build', 'release']

        - name: Validate prepared artifacts
          ansible.builtin.include_tasks: tasks/artifacts.yml
          when: remote_codex_action != 'preview'

        - name: Deploy forwarder
          ansible.builtin.include_tasks: tasks/deploy.yml
          when: remote_codex_action == 'deploy'

        - name: Publish prepared private Android update
          ansible.builtin.include_tasks: tasks/publish.yml
          when: remote_codex_action in ['publish', 'release']

        - name: Verify published update
          ansible.builtin.include_tasks: tasks/verify.yml
          when: remote_codex_action in ['publish', 'release'] and not ansible_check_mode

        - name: Deliver prepared APK to the explicit phone
          ansible.builtin.command:
            argv: [tailscale, file, cp, "{{ repo }}/dist/updates/releases/{{ release_manifest.versionCode }}/remote-codex.apk", "{{ remote_codex_phone }}:"]
          become: true
          when: remote_codex_action == 'deliver'

        - name: Record completed build or release
          ansible.builtin.include_tasks: tasks/record.yml
          when: remote_codex_action in ['build', 'release']

        - name: Result
          ansible.builtin.debug:
            msg:
              status: "{{ 'preview' if ansible_check_mode or remote_codex_action == 'preview' else 'success' }}"
              action: "{{ remote_codex_action }}"
              version: "{{ release_manifest.versionName | default('n/a') }}"
              versionCode: "{{ release_manifest.versionCode | default('n/a') }}"
              built: "{{ release_built }}"
              published: "{{ release_published }}"
              verified: "{{ release_verified }}"
              artifact: "{{ repo + '/dist/updates/releases/' + (release_manifest.versionCode | string) + '/remote-codex.apk' if release_manifest is defined else 'n/a' }}"
              commit: "{{ recorded_commit.stdout | default('none') }}"
              log: "{{ run_log }}"
              installation: user initiated
      rescue:
        - name: Inspect remaining checkout changes
          ansible.builtin.command:
            argv: [git, status, --short]
            chdir: "{{ repo }}"
          register: remaining_changes
          changed_when: false
          failed_when: false

        - name: Result
          ansible.builtin.debug:
            msg:
              status: failed
              stage: "{{ release_stage }}"
              failed_task: "{{ ansible_failed_task.name }}"
              version: "{{ selected_version.versionName | default(release_manifest.versionName | default('n/a')) }}"
              artifact_directory: "{{ repo }}/dist"
              built: "{{ release_built }}"
              published: "{{ release_published }}"
              publication_attempted: "{{ publication_attempted }}"
              verified: "{{ release_verified }}"
              uncommitted_changes: "{{ remaining_changes.stdout }}"
              log: "{{ run_log }}"
              build_log: "{{ run_log }}.build.log"
              deployment_recovery_files: "{{ [installed_forwarder.backup_file | default(''), installed_service.backup_file | default('')] | reject('equalto', '') | list }}"
              recovery: Inspect the failed stage and current published state before explicitly resuming. No mutation was retried or rolled back.

        - name: Stop after failed workflow
          ansible.builtin.fail:
            msg: "{{ release_stage }} failed; see {{ run_log }}. Preserved artifacts and preparation changes need review."

  handlers:
    - name: Restart forwarder
      when: not ansible_check_mode
      ansible.builtin.systemd_service:
        name: remote-codex-forwarder.service
        scope: user
        daemon_reload: true
        state: restarted
      environment:
        XDG_RUNTIME_DIR: "/run/user/{{ user_id.stdout }}"
