name: iOS checks
on:
  push:
    paths: ['ios/**', 'scripts/ios', 'scripts/ios-*', 'scripts/tests/ios-*', '.github/workflows/ios-*.yml']
  pull_request:
    paths: ['ios/**', 'scripts/ios', 'scripts/ios-*', 'scripts/tests/ios-*', '.github/workflows/ios-*.yml']
permissions:
  contents: read
concurrency:
  group: ios-check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: macos-15
    timeout-minutes: 25
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Core, unsigned simulator build, fixture UI tests
        run: scripts/ios-ci check
      - name: Compact results and synthetic screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ios-check-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/ios/check/report/
          retention-days: 1
          if-no-files-found: error
