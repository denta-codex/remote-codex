[package]
name = "remote-codex-todo-cli"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false

[[bin]]
name = "todo"
path = "src/main.rs"

[dependencies]
remote-codex-todo = { path = "../todo-core" }
clap = { version = "4.6.7", features = ["derive", "env"] }
serde_json = "1"

[dev-dependencies]
rusqlite = { version = "0.37.0", features = ["bundled"] }
tempfile = "3"
