[package]
name = "remote-codex-forwarder"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"
publish = false

[workspace]
members = ["todo-core", "todo-cli"]
resolver = "3"

[dependencies]
remote-codex-todo = { path = "todo-core" }
serde_json = "1.0.145"
serde = { version = "1.0", features = ["derive"] }
base64 = "0.22.1"
futures-util = { version = "0.3", features = ["sink"] }
tokio-tungstenite = "0.28"
httparse = "1.10.1"
libc = "0.2.176"
sha2 = "0.10.9"
subtle = "2.6.1"
tokio = { version = "1.47.1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }

[dev-dependencies]
base64 = "0.22.1"
serde_json = "1.0.145"
tempfile = "3.23.0"

[profile.release]
codegen-units = 1
lto = "thin"
strip = true
