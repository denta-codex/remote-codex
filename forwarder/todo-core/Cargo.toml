[package]
name = "remote-codex-todo"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false

[dependencies]
clap = { version = "4.6.7", features = ["derive", "env"] }
rusqlite = { version = "0.37.0", features = ["bundled", "backup"] }
